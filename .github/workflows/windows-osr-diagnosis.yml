name: Windows OSR diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34715796683
          name: package-windows-x86_64-msi
          path: package
      - shell: pwsh
        run: |
          $msi = Get-ChildItem package -Filter *.msi -Recurse | Select-Object -First 1
          $setup = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Install failed: $($setup.ExitCode)" }
          $env:SABINE_TRACE = '1'
          $appLog = Join-Path $env:RUNNER_TEMP 'baseline.log'
          $app = Start-Process (Join-Path $env:LOCALAPPDATA 'Programs/dev.sabine.release-probe/release-probe.exe') -RedirectStandardError $appLog -PassThru
          Start-Sleep -Seconds 5
          if (-not $app.HasExited) { $app.Kill($true); $app.WaitForExit() }
          $baseline = Get-Content $appLog -Raw
          Write-Host $baseline
          if ($baseline -notmatch 'Chromium adapter LUID=([0-9,-]+)') { throw 'No adapter LUID' }
          $luid = $Matches[1]
          $data = Join-Path $env:LOCALAPPDATA 'Sabine'
          $current = Get-Content (Join-Path $data 'bin/current.json') -Raw | ConvertFrom-Json
          $hostPath = Join-Path $data "bin/versions/$($current.active)/sabine-host.exe"
          $library = Get-ChildItem $env:LOCALAPPDATA -Filter libcef.dll -File -Recurse | Select-Object -First 1
          if ($null -eq $library) { throw 'No installed libcef.dll found' }
          $resources = Join-Path $library.Directory.Parent.FullName 'Resources'
          foreach ($variant in @('default', 'd3d11-luid', 'warp', 'warp-luid')) {
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $accept = $listener.AcceptTcpClientAsync()
            $start = [Diagnostics.ProcessStartInfo]::new($hostPath)
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardError = $true
            $start.RedirectStandardOutput = $true
            $start.WorkingDirectory = $library.Directory.FullName
            $start.Environment['PATH'] = "$($library.Directory.FullName);$env:PATH"
            $start.Environment['SABINE_OSR_TOKEN'] = 'diagnostic-token'
            foreach ($argument in @('--sabine-osr', '--sabine-shared-texture', "--sabine-parent-pid=$PID", "--sabine-osr-endpoint=$($listener.LocalEndpoint)", '--sabine-width=960', '--sabine-height=640', '--sabine-scale=1', '--url=data:text/html,<html><body style="background:blue">OSR diagnostic</body></html>', "--root-cache-path=$env:RUNNER_TEMP/profile-$variant", "--sabine-resources-dir-path=$resources", "--sabine-locales-dir-path=$resources/locales", '--enable-logging=stderr', '--v=1')) { $start.ArgumentList.Add($argument) }
            if ($variant -eq 'd3d11-luid') { $start.ArgumentList.Add('--use-angle=d3d11') }
            if ($variant.StartsWith('warp')) { $start.ArgumentList.Add('--use-angle=d3d11-warp') }
            if ($variant.EndsWith('luid')) { $start.ArgumentList.Add("--use-adapter-luid=$luid") }
            $process = [Diagnostics.Process]::Start($start)
            $errors = $process.StandardError.ReadToEndAsync()
            $output = $process.StandardOutput.ReadToEndAsync()
            $client = $null
            try {
              if (-not $accept.Wait(10000)) { throw 'Host did not connect' }
              $client = $accept.Result
              $drain = $client.GetStream().CopyToAsync([IO.Stream]::Null)
              Start-Sleep -Seconds 8
              Write-Host "VARIANT $variant ALIVE=$(-not $process.HasExited)"
            } finally {
              if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit() }
              if ($null -ne $client) { $client.Dispose() }
              $listener.Stop()
              [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP "$variant.log"), $errors.Result)
              $process.Dispose()
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-diagnostics
          path: ${{ runner.temp }}/*.log
