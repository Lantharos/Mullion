name: Package smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: msi
            update_target: windows-x86_64-msi
            extension: .msi
          - os: windows-latest
            target: exe
            update_target: windows-x86_64-exe
            extension: .exe
          - os: macos-15
            target: dmg
            update_target: macos-aarch64-dmg
            extension: .dmg
          - os: ubuntu-24.04
            target: appimage
            update_target: linux-x86_64-appimage
            extension: .AppImage
          - os: ubuntu-24.04
            target: deb
            update_target: linux-x86_64-deb
            extension: .deb
          - os: ubuntu-24.04
            target: rpm
            update_target: linux-x86_64-rpm
            extension: .rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: rustup toolchain install 1.89 --profile minimal
      - run: rustup override set 1.89
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev dpkg-dev rpm
          if [ "${{ matrix.target }}" = "appimage" ]; then
            sudo curl --fail --location --output /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            sudo chmod +x /usr/local/bin/appimagetool
          fi
      - name: Install MSI packaging dependencies
        if: matrix.target == 'msi'
        run: |
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          wix extension add --global WixToolset.UI.wixext/7.0.0 WixToolset.Util.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX extension installation failed; check WiX EULA acceptance" }
      - name: Install Windows icon and setup tools
        if: runner.os == 'Windows'
        run: |
          choco install imagemagick nsis --yes --no-progress
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
          $magick = Get-ChildItem "$env:ProgramFiles\ImageMagick-*\magick.exe" | Select-Object -First 1
          if ($null -eq $magick) {
            throw "ImageMagick installation did not provide magick.exe"
          }
          $magick.DirectoryName >> $env:GITHUB_PATH
      - name: Build offline Windows setup dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --workspace
          if ($LASTEXITCODE -ne 0) { throw "workspace build failed" }
          $hostPath = cargo run --release -p sabine-cli -- runtime prepare | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "native host preparation failed" }
          Copy-Item $hostPath target/release/sabine-host.exe
      - name: Generate real app and signing key
        shell: pwsh
        run: |
          cargo run --release -p sabine-cli -- new release-probe
          $config = Get-Content release-probe/Sabine.toml -Raw
          $config = $config.Replace('[app]', "[app]`nmaintainer = `"Package Tests <packages@example.test>`"`nlicense = `"MIT`"")
          [IO.File]::WriteAllText((Join-Path $PWD 'release-probe/Sabine.toml'), $config, [Text.UTF8Encoding]::new($false))
          $privateKey = cargo run --release -p sabine-cli -- release-keygen --public-output release-probe/update-public-key.txt | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($privateKey)) {
            throw "release key generation failed"
          }
          "SABINE_UPDATE_SIGNING_KEY=$privateKey" >> $env:GITHUB_ENV
      - name: Install and build web application
        working-directory: release-probe
        run: |
          bun install
          bun run build
      - name: Build native package and signed metadata
        shell: pwsh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          $offline = @()
          if ('${{ runner.os }}' -eq 'Windows') { $offline = @('--offline') }
          cargo run --release -p sabine-cli -- bundle release-probe --target "${{ matrix.target }}" --release @offline
          if ($LASTEXITCODE -ne 0) { throw "package build failed" }
          $artifacts = @(Get-ChildItem dist/artifacts -File)
          if ($artifacts.Count -ne 1 -or $artifacts[0].Extension -cne "${{ matrix.extension }}") {
            throw "expected one ${{ matrix.extension }} artifact, found $($artifacts.Name -join ', ')"
          }
          Remove-Item Env:GITHUB_REF_NAME
          cargo run --release -p sabine-cli -- release-manifest release-probe --output dist/sabine-update.json --artifact "${{ matrix.update_target }}=$($artifacts[0].FullName)"
          $manifest = Get-Content dist/sabine-update.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.signature)) {
            throw "release manifest signature is missing"
          }
      - name: Install and launch Windows MSI
        if: matrix.target == 'msi'
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem dist/artifacts -Filter *.msi -File)
          $stagedExe = @(Get-ChildItem dist/msi -Filter release-probe.exe -File -Recurse)
          if ($msi.Count -ne 1 -or $stagedExe.Count -ne 1) {
            throw "expected one MSI and one staged executable"
          }
          $headers = (& llvm-objdump --private-headers $stagedExe[0].FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-objdump could not inspect the staged executable"
          }
          if ($headers -match '(?i)(VCRUNTIME|MSVCP|api-ms-win-crt)') {
            throw "Windows executable still depends on the redistributable C runtime"
          }
          if ($headers -notmatch '(?i)Subsystem\s+00000002\s+\(Windows GUI\)') {
            throw "Windows executable is not marked as a GUI application"
          }
          $wixSource = Get-Content (Get-ChildItem dist/msi -Filter installer.wxs -File -Recurse | Select-Object -First 1) -Raw
          if ($wixSource -notmatch '<Icon Id="AppIcon.ico"' -or $wixSource -notmatch 'Icon="AppIcon.ico"') {
            throw "MSI shortcut icon metadata is missing"
          }
          $log = Join-Path $env:RUNNER_TEMP "sabine-msi-install.log"
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 100
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs/dev.sabine.release-probe'
          $installedExe = Get-Item (Join-Path $appDir 'release-probe.exe')
          if ($null -eq $installedExe -or -not (Test-Path (Join-Path $appDir 'resources/windows-app.ico'))) {
            throw "MSI did not install the x64 application and icon under the current user profile"
          }
          $registry = Join-Path $env:LOCALAPPDATA 'Sabine/apps.json'
          $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
          if (-not $registered.PSObject.Properties['dev.sabine.release-probe']) {
            throw "MSI finished without preparing and registering the application"
          }
          $repair = Start-Process msiexec.exe -ArgumentList @('/fa', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
          if ($repair.ExitCode -ne 0) { Get-Content $log -Tail 100; throw "MSI repair failed" }
          try {
            $app = Start-Process $installedExe.FullName -PassThru
            Start-Sleep -Seconds 8
            if ($app.HasExited) {
              throw "installed application exited during launch with code $($app.ExitCode)"
            }
            Stop-Process -Id $app.Id -Force
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { Get-Content $log -Tail 100; throw "MSI uninstall failed" }
            $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
            if ($registered.PSObject.Properties['dev.sabine.release-probe']) { throw "MSI left the app registered" }
            if (Test-Path $installedExe.FullName) { throw "MSI left its application executable" }
          }
      - name: Validate macOS bundle metadata and native icon decoding
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem dist/dmg -Filter '*.app' -Directory -Recurse | Select-Object -First 1
          $plist = Join-Path $bundle.FullName 'Contents/Info.plist'
          & plutil -lint $plist
          if ($LASTEXITCODE -ne 0) { throw 'Invalid bundle property list' }
          $kind = & plutil -extract CFBundlePackageType raw $plist
          if ($kind -cne 'APPL') { throw 'Bundle is not registered as an application' }
          $iconName = & plutil -extract CFBundleIconFile raw $plist
          if ($LASTEXITCODE -ne 0) { throw 'Bundle icon metadata is missing' }
          $icon = Join-Path $bundle.FullName "Contents/Resources/$iconName"
          $iconSet = Join-Path $env:RUNNER_TEMP 'sabine-probe.iconset'
          & iconutil --convert iconset --output $iconSet $icon
          if ($LASTEXITCODE -ne 0) { throw 'macOS could not decode the application icon' }
          $images = @(Get-ChildItem $iconSet -Filter '*.png')
          if ($images.Count -lt 8) { throw 'Application icon is missing standard or Retina sizes' }
      - name: Install, repair, launch, and uninstall Windows setup
        if: matrix.target == 'exe'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/artifacts -Filter *.exe -File | Select-Object -First 1
          $appId = 'dev.sabine.release-probe'
          $appDir = Join-Path $env:LOCALAPPDATA "Programs/$appId"
          $registry = Join-Path $env:LOCALAPPDATA 'Sabine/apps.json'
          $logs = Join-Path $env:LOCALAPPDATA 'sabine/logs/installer.jsonl'
          $app = $null
          try {
            foreach ($operation in @('install', 'repair')) {
              $process = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                if (Test-Path $logs) { Get-Content $logs -Tail 30 }
                throw "Setup $operation failed with code $($process.ExitCode)"
              }
              $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
              if (-not $registered.PSObject.Properties[$appId]) {
                throw "Setup finished without registering the application"
              }
            }
            $app = Start-Process (Join-Path $appDir 'release-probe.exe') -PassThru
            Start-Sleep -Seconds 8
            if ($app.HasExited) { throw "Installed application exited with code $($app.ExitCode)" }
          } finally {
            if ($null -ne $app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $uninstaller = Join-Path $appDir 'Uninstall.exe'
            if (Test-Path $uninstaller) {
              $process = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "Uninstall failed with code $($process.ExitCode)" }
              for ($attempt = 0; $attempt -lt 100 -and (Test-Path $uninstaller); $attempt++) {
                Start-Sleep -Milliseconds 100
              }
              if (Test-Path $uninstaller) { throw "Uninstaller did not remove the package" }
              $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
              if ($registered.PSObject.Properties[$appId]) { throw "Uninstall left the app registered" }
              if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Sabine/bin/current.json'))) {
                throw "App uninstall removed the shared Sabine installation"
              }
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.update_target }}
          path: |
            dist/artifacts/*
            dist/sabine-update.json
          if-no-files-found: error
