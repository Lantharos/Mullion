name: Package smoke test

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package format to validate
        type: choice
        default: all
        options: [all, exe, msi, dmg, appimage, deb, rpm]

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PACKAGE_TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          targets = [
              {'os': 'windows-latest', 'target': 'msi', 'update_target': 'windows-x86_64-msi', 'extension': '.msi'},
              {'os': 'windows-latest', 'target': 'exe', 'update_target': 'windows-x86_64-exe', 'extension': '.exe'},
              {'os': 'macos-15', 'target': 'dmg', 'update_target': 'macos-aarch64-dmg', 'extension': '.dmg'},
              {'os': 'ubuntu-24.04', 'target': 'appimage', 'update_target': 'linux-x86_64-appimage', 'extension': '.AppImage'},
              {'os': 'ubuntu-24.04', 'target': 'deb', 'update_target': 'linux-x86_64-deb', 'extension': '.deb'},
              {'os': 'ubuntu-24.04', 'target': 'rpm', 'update_target': 'linux-x86_64-rpm', 'extension': '.rpm'},
          ]
          selected = os.environ['PACKAGE_TARGET']
          if selected != 'all':
              targets = [target for target in targets if target['target'] == selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': targets}), file=output)
          PYTHON
  package:
    needs: targets
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: rustup toolchain install 1.90 --profile minimal
      - run: rustup override set 1.90
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libfontconfig1-dev libxkbcommon-dev dpkg-dev rpm
          if [ "${{ matrix.target }}" = "appimage" ]; then
            sudo curl --fail --location --output /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            sudo chmod +x /usr/local/bin/appimagetool
          fi
      - name: Install MSI packaging dependencies
        if: matrix.target == 'msi'
        run: |
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          wix eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw "WiX EULA acceptance failed" }
          wix extension add --global WixToolset.UI.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw "WiX extension installation failed; check WiX EULA acceptance" }
      - name: Install Windows setup tools
        if: runner.os == 'Windows'
        run: |
          choco install nsis --yes --no-progress
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Build offline Windows setup dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --workspace
          if ($LASTEXITCODE -ne 0) { throw "workspace build failed" }
          $hostPath = cargo run --release -p sabine-cli -- runtime prepare | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "native host preparation failed" }
          Copy-Item $hostPath target/release/sabine-host.exe
          Copy-Item ([IO.Path]::ChangeExtension($hostPath, '.dll')) target/release/sabine-host.dll
          Copy-Item (Join-Path (Split-Path $hostPath) 'chrome_elf.dll') target/release/chrome_elf.dll
      - name: Generate real app and signing key
        shell: pwsh
        run: |
          cargo run --release -p sabine-cli -- new release-probe
          $cargoPath = (Join-Path $PWD 'crates/sabine').Replace('\', '/')
          $cargo = Get-Content release-probe/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^sabine = .+$', "sabine = { path = `"$cargoPath`" }"
          [IO.File]::WriteAllText((Join-Path $PWD 'release-probe/Cargo.toml'), $cargo, [Text.UTF8Encoding]::new($false))
          $package = Get-Content release-probe/package.json -Raw | ConvertFrom-Json
          $package.dependencies.'@lantharos/sabine' = 'file:' + (Join-Path $PWD 'packages/sabine').Replace('\', '/')
          [IO.File]::WriteAllText((Join-Path $PWD 'release-probe/package.json'), ($package | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          $config = Get-Content release-probe/Sabine.toml -Raw
          $config = $config.Replace('[app]', "[app]`nmaintainer = `"Package Tests <packages@example.test>`"`nlicense = `"MIT`"")
          [IO.File]::WriteAllText((Join-Path $PWD 'release-probe/Sabine.toml'), $config, [Text.UTF8Encoding]::new($false))
          $privateKey = cargo run --release -p sabine-cli -- release-keygen --public-output release-probe/update-public-key.txt | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($privateKey)) {
            throw "release key generation failed"
          }
          "SABINE_UPDATE_SIGNING_KEY=$privateKey" >> $env:GITHUB_ENV
      - name: Install and build web application
        working-directory: release-probe
        run: |
          bun install
          bun run build
      - name: Build native package and signed metadata
        shell: pwsh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          $offline = @()
          if ('${{ runner.os }}' -eq 'Windows') { $offline = @('--offline') }
          if ('${{ matrix.target }}' -eq 'exe') {
            New-Item release-probe/ui/public -ItemType Directory -Force | Out-Null
            Set-Content release-probe/ui/public/obsolete.txt 'Owned by the first release'
          }
          cargo run --release -p sabine-cli -- bundle release-probe --target "${{ matrix.target }}" --release @offline
          if ($LASTEXITCODE -ne 0) { throw "package build failed" }
          $artifacts = @(Get-ChildItem dist/artifacts -File)
          if ($artifacts.Count -ne 1 -or $artifacts[0].Extension -cne "${{ matrix.extension }}") {
            throw "expected one ${{ matrix.extension }} artifact, found $($artifacts.Name -join ', ')"
          }
          Remove-Item Env:GITHUB_REF_NAME
          cargo run --release -p sabine-cli -- release-manifest release-probe --output dist/sabine-update.json --artifact "${{ matrix.update_target }}=$($artifacts[0].FullName)"
          $manifest = Get-Content dist/sabine-update.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.signature)) {
            throw "release manifest signature is missing"
          }
      - name: Install and launch Windows MSI
        if: matrix.target == 'msi'
        shell: pwsh
        run: |
          . ./scripts/windows-package-check.ps1
          . ./scripts/windows-browser-check.ps1
          $msi = @(Get-ChildItem dist/artifacts -Filter *.msi -File)
          $stagedExe = @(Get-ChildItem dist/msi -Filter release-probe.exe -File -Recurse)
          if ($msi.Count -ne 1 -or $stagedExe.Count -ne 1) {
            throw "expected one MSI and one staged executable"
          }
          $headers = (& llvm-objdump --private-headers $stagedExe[0].FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-objdump could not inspect the staged executable"
          }
          if ($headers -match '(?i)(VCRUNTIME|MSVCP|api-ms-win-crt)') {
            throw "Windows executable still depends on the redistributable C runtime"
          }
          if ($headers -notmatch '(?i)Subsystem\s+00000002\s+\(Windows GUI\)') {
            throw "Windows executable is not marked as a GUI application"
          }
          $log = Join-Path $env:RUNNER_TEMP "sabine-msi-install.log"
          Test-MsiCancellation $msi[0].FullName $log
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs/dev.sabine.release-probe'
          if (Test-Path (Join-Path $appDir 'release-probe.exe')) { throw 'Cancelled MSI retained installed application files' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -PassThru
          Wait-InstallerExit $install
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 100
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs/dev.sabine.release-probe'
          $installedExe = Get-Item (Join-Path $appDir 'release-probe.exe')
          if ($null -eq $installedExe -or -not (Test-Path (Join-Path $appDir 'resources/windows-app.ico'))) {
            throw "MSI did not install the x64 application and icon under the current user profile"
          }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'release-probe.lnk'
          if (-not (Test-Path $shortcutPath)) { throw 'MSI did not install its Start Menu shortcut' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          $iconPath = ($shortcut.IconLocation -replace ',\d+$', '').Trim('"')
          $icon = [System.Drawing.Icon]::new($iconPath)
          $icon.Dispose()
          $registry = Join-Path $env:LOCALAPPDATA 'Sabine/apps.json'
          $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
          if (-not $registered.PSObject.Properties['dev.sabine.release-probe']) {
            throw "MSI finished without preparing and registering the application"
          }
          $repair = Start-Process msiexec.exe -ArgumentList @('/fa', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -PassThru
          Wait-InstallerExit $repair
          if ($repair.ExitCode -ne 0) { Get-Content $log -Tail 100; throw "MSI repair failed" }
          $app = $null
          try {
            $env:SABINE_TRACE = '1'
            $appLog = Join-Path $env:RUNNER_TEMP 'sabine-msi-app.log'
            $app = Start-Process $installedExe.FullName -RedirectStandardError $appLog -PassThru
            Wait-SabineAppFrame $app $appLog
            Test-SabineBrowser
          } finally {
            if ($null -ne $app -and -not $app.HasExited) { $app.Kill($true); $app.WaitForExit() }
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi[0].FullName, '/qn', '/norestart', '/l*v', $log) -PassThru
            Wait-InstallerExit $uninstall
            if ($uninstall.ExitCode -ne 0) { Get-Content $log -Tail 100; throw "MSI uninstall failed" }
            $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
            if ($registered.PSObject.Properties['dev.sabine.release-probe']) { throw "MSI left the app registered" }
            if (Test-Path $installedExe.FullName) { throw "MSI left its application executable" }
          }
      - name: Validate macOS bundle metadata and native icon decoding
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem dist/dmg -Filter '*.app' -Directory -Recurse | Select-Object -First 1
          $plist = Join-Path $bundle.FullName 'Contents/Info.plist'
          & plutil -lint $plist
          if ($LASTEXITCODE -ne 0) { throw 'Invalid bundle property list' }
          $kind = & plutil -extract CFBundlePackageType raw $plist
          if ($kind -cne 'APPL') { throw 'Bundle is not registered as an application' }
          $iconName = & plutil -extract CFBundleIconFile raw $plist
          if ($LASTEXITCODE -ne 0) { throw 'Bundle icon metadata is missing' }
          $icon = Join-Path $bundle.FullName "Contents/Resources/$iconName"
          $iconSet = Join-Path $env:RUNNER_TEMP 'sabine-probe.iconset'
          & iconutil --convert iconset --output $iconSet $icon
          if ($LASTEXITCODE -ne 0) { throw 'macOS could not decode the application icon' }
          $images = @(Get-ChildItem $iconSet -Filter '*.png')
          if ($images.Count -lt 8) { throw 'Application icon is missing standard or Retina sizes' }
      - name: Install, repair, launch, and uninstall Windows setup
        if: matrix.target == 'exe'
        shell: pwsh
        run: |
          . ./scripts/windows-package-check.ps1
          . ./scripts/windows-browser-check.ps1
          $setup = Get-ChildItem dist/artifacts -Filter *.exe -File | Select-Object -First 1
          $appId = 'dev.sabine.release-probe'
          $appDir = Join-Path $env:LOCALAPPDATA "Programs/$appId"
          $registry = Join-Path $env:LOCALAPPDATA 'Sabine/apps.json'
          $logs = Join-Path $env:LOCALAPPDATA 'sabine/logs/installer.jsonl'
          $app = $null
          try {
            Test-SetupCancellation $setup.FullName (Join-Path $env:RUNNER_TEMP 'cancelled-application')
            $userFile = Join-Path $appDir 'my-notes.txt'
            foreach ($operation in @('install', 'repair')) {
              $process = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
              Wait-InstallerExit $process
              if ($process.ExitCode -ne 0) {
                if (Test-Path $logs) { Get-Content $logs -Tail 30 }
                throw "Setup $operation failed with code $($process.ExitCode)"
              }
              $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
              if (-not $registered.PSObject.Properties[$appId]) {
                throw "Setup finished without registering the application"
              }
              if ($operation -eq 'install') {
                Set-Content $userFile 'Keep my notes'
              } elseif ((Get-Content $userFile -Raw).Trim() -ne 'Keep my notes') {
                throw 'Repair changed a user-created file'
              }
            }
            Remove-Item release-probe/ui/public/obsolete.txt
            Set-Content release-probe/ui/public/replacement.txt 'Owned by the second release'
            & target/release/sabine.exe bundle release-probe --target exe --release --offline --version 0.1.1
            if ($LASTEXITCODE -ne 0) { throw 'Upgrade package build failed' }
            $upgrade = Get-ChildItem dist/artifacts -Filter '*-0.1.1-exe.exe' -File | Select-Object -First 1
            $process = Start-Process $upgrade.FullName -ArgumentList '/S' -PassThru
            Wait-InstallerExit $process
            if ($process.ExitCode -ne 0) { throw "Upgrade failed with $($process.ExitCode)" }
            if (Get-ChildItem $appDir -Filter obsolete.txt -Recurse) { throw 'Upgrade retained obsolete packaged files' }
            if (-not (Get-ChildItem $appDir -Filter replacement.txt -Recurse)) { throw 'Upgrade omitted new packaged files' }
            if ((Get-Content $userFile -Raw).Trim() -ne 'Keep my notes') { throw 'Upgrade changed user data' }
            $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
            if ($registered.$appId.version -ne '0.1.1') { throw 'Upgrade left the old application registration' }
            $env:SABINE_TRACE = '1'
            $appLog = Join-Path $env:RUNNER_TEMP 'sabine-exe-app.log'
            $app = Start-Process (Join-Path $appDir 'release-probe.exe') -RedirectStandardError $appLog -PassThru
            Wait-SabineAppFrame $app $appLog
            Test-SabineBrowser
          } finally {
            if ($null -ne $app -and -not $app.HasExited) { $app.Kill($true); $app.WaitForExit() }
            $uninstaller = Join-Path $appDir 'Uninstall.exe'
            if (Test-Path $uninstaller) {
              $process = Start-Process $uninstaller -ArgumentList '/S' -PassThru
              Wait-InstallerExit $process
              if ($process.ExitCode -ne 0) { throw "Uninstall failed with code $($process.ExitCode)" }
              for ($attempt = 0; $attempt -lt 100 -and (Test-Path $uninstaller); $attempt++) {
                Start-Sleep -Milliseconds 100
              }
              if (Test-Path $uninstaller) { throw "Uninstaller did not remove the package" }
              if ((Get-Content $userFile -Raw).Trim() -ne 'Keep my notes') { throw 'Uninstall removed user data' }
              $registered = (Get-Content $registry -Raw | ConvertFrom-Json).apps
              if ($registered.PSObject.Properties[$appId]) { throw "Uninstall left the app registered" }
              if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Sabine/bin/current.json'))) {
                throw "App uninstall removed the shared Sabine installation"
              }
            }
          }
      - name: Preserve Windows installer diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/sabine-msi-*.log
            ${{ runner.temp }}/sabine-exe-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-${{ matrix.update_target }}
          path: |
            dist/artifacts/*
            dist/sabine-update.json
          if-no-files-found: error
