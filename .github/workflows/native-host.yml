name: Native CEF host checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libfontconfig1-dev libxkbcommon-dev libx11-dev libgtk-3-dev libnss3-dev libasound2-dev libgbm-dev ninja-build
      - run: rustup toolchain install 1.89 --profile minimal
      - run: rustup override set 1.89
      - name: Build CLI and service
        run: cargo build --locked -p sabine-cli -p sabine-service
      - name: Build native CEF host
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $cli = "target/debug/sabine$suffix"
          $output = & $cli runtime prepare
          $output | Set-Content host-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native host preparation failed' }
          $hostPath = $output | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) {
            throw "Native host was not found: $hostPath"
          }
          "SABINE_HOST_PATH=$hostPath" >> $env:GITHUB_ENV
      - name: Sign and protect the macOS host bundle
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $bundle = Split-Path (Split-Path (Split-Path $env:SABINE_HOST_PATH))
          foreach ($helper in Get-ChildItem "$bundle/Contents/Frameworks" -Filter '*.app' -Directory) {
            & codesign --force --sign - $helper.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Could not sign the helper bundle' }
          }
          & codesign --force --sign - $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Could not sign the host bundle' }
          & chmod -R a-w $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Could not protect the host bundle' }
      - name: Initialize the native Chromium runtime
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "target/debug/sabine$suffix" runtime doctor --json | Tee-Object -FilePath host-doctor.json
          if ($LASTEXITCODE -ne 0) { throw 'Native CEF initialization failed' }
      - name: Verify the macOS signature after launch
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $bundle = Split-Path (Split-Path (Split-Path $env:SABINE_HOST_PATH))
          & codesign --verify --deep --strict $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Launching changed the signed host bundle' }
          $executions = Join-Path $env:HOME 'Library/Application Support/sabine/executions'
          $bundles = @(Get-ChildItem $executions -Directory -Recurse -Filter 'sabine-host.app')
          if ($bundles.Count -ne 1) { throw 'Expected one cached Chromium launch bundle' }
          & codesign --verify --deep --strict $bundles[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'The launch bundle signature is invalid' }

      - name: Check Windows console ownership
        if: runner.os == 'Windows'
        run: cargo test --locked -p sabine-runtime process::tests::background_children_do_not_inherit_a_console -- --exact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-host-${{ matrix.os }}
          path: |
            host-build.log
            host-doctor.json
